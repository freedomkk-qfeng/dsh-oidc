name: 缺陷报告
description: 报告可复现、且不涉及安全漏洞的问题
title: "[Bug] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: 请勿包含 Token、Key、Cookie、个人数据、生产 Profile 或私有地址。安全漏洞请按 SECURITY.md 私密报告。
  - type: input
    id: versions
    attributes:
      label: 版本
      description: dsh-oidc、DSH、Node.js 和 pi-ai 版本
    validations: { required: true }
  - type: dropdown
    id: backend
    attributes:
      label: Backend 类型
      options: [Web, Native]
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 最小复现步骤，以及已脱敏的 Profile/日志片段
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: 预期行为 }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: 实际行为 }
    validations: { required: true }
  - type: checkboxes
    id: hygiene
    attributes:
      label: 数据检查
      options:
        - label: 我已移除所有秘密、个人数据和仅限生产环境的标识符/地址。
          required: true
        - label: 这不是安全漏洞。
          required: true
