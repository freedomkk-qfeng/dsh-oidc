name: Feature request (English)
description: Propose an interoperable, bounded enhancement
title: "[Feature] "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: Describe the user or integration problem rather than only a proposed API. }
    validations: { required: true }
  - type: textarea
    id: boundary
    attributes: { label: Proposed boundary, description: Is this OIDC, Key Binding, Profile data, DSH integration, or product-specific? }
    validations: { required: true }
  - type: textarea
    id: standards
    attributes: { label: Relevant standards or DSH capability }
  - type: textarea
    id: security
    attributes: { label: Security and compatibility impact }
    validations: { required: true }
